name: Feature request
description: Propose a capability the runner does not have.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Open this to agree the problem first. A change to the row format or to an output mode
        alters every table that exists, so it is discussed before it is written.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to test, and where the runner stopped you.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: >
        The workaround you have, and what it costs. A problem with no workaround is worth saying so
        plainly.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: The shape you have in mind
      description: The table or the call as you would write it, where you have one. Leave it empty rather than guess.
      render: bash
    validations:
      required: false
